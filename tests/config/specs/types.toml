[[endpoint]]
uri = "/alltypes/list"
fetch_limit = 20

[endpoint.resource]
type = "query"
query = "SELECT * FROM alltypes LIMIT {{-limit-}} OFFSET {{-offset-}}"


[[endpoint]]
uri = "/alltypes/{type_id:\\d+}"
single_record_response = true

[endpoint.resource]
type = "query"
query = "SELECT * FROM alltypes WHERE id={{type_id}}"


[[endpoint]]
uri = "/alltypes/script/table"

[endpoint.resource]
type = "data_script"
script = """
return {
    null_val = nil,
    bool_val = false,
    int_val = 1,
    float_val = 2.2,
    string_val = "String from LUA",
}
"""


[[endpoint]]
uri = "/alltypes/script/tuple"

[endpoint.resource]
type = "data_script"
script = """
if ctx:has_arg("empty") then
    return {}
end

return {
    nil,
    true,
    1,
    2.2,
    "String from LUA"
}
"""

