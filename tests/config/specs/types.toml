[[endpoint]]
uri = "/alltypes/list"
fetch_limit = 20

[endpoint.resource]
type = "query"
query = "SELECT * FROM alltypes LIMIT {{-limit-}} OFFSET {{-offset-}}"


[[endpoint]]
uri = "/alltypes/{type_id:\\d+}"
single_record_response = true

[endpoint.resource]
type = "query"
query = "SELECT * FROM alltypes WHERE id={{type_id}}"

