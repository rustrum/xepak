[[endpoint]]
uri = "/limits"
pre_processors = [
    {
        type = "limit_offset",
        limit_max_value = 4
    }
]

[endpoint.resource]
type = "query"
query = """
SELECT * FROM alltypes LIMIT {{-limit-}} OFFSET {{-offset-}}
"""

[[endpoint]]
uri = "/limits/lua"
pre_processors = [
    {
        type = "limit_offset",
        limit_max_value = 4
    }
]

[endpoint.resource]
type = "query_script_lua"
script = """
local query = query_builder("SELECT * FROM alltypes");
query:add("LIMIT {{-limit-}} OFFSET {{-offset-}}");
return query:build();
"""



