[[endpoint]]
uri = "/auth/script/public"

[endpoint.resource]
type = "data_script"
script = """
return {
    id = ctx:get_auth_id(),
    roles = ctx:get_auth_roles(),
    is_admin = ctx:has_auth_role("admin"),
    is_manager = ctx:has_auth_role("manager"),
}
"""


[[endpoint]]
uri = "/auth/script/nodef"
pre_processors_ignore_default = true

[endpoint.resource]
type = "data_script"
script = """
return {
    always = "public"
}
"""


[[endpoint]]
uri = "/auth/script/info"

pre_processors = [
    { type = "simple_authentication" },
]

[endpoint.resource]
type = "data_script"
script = """
return {
    id = ctx:get_auth_id(),
    roles = ctx:get_auth_roles(),
    is_admin = ctx:has_auth_role("admin"),
    is_manager = ctx:has_auth_role("manager"),
}
"""


[[endpoint]]
uri = "/auth/script/anon"

pre_processors = [
    {
        type = "simple_authentication",
        anonymous_auth = true,
    },
]

[endpoint.resource]
type = "data_script"
script = """
return {
    id = ctx:get_auth_id(),
    roles = ctx:get_auth_roles(),
    is_admin = ctx:has_auth_role("admin"),
    is_manager = ctx:has_auth_role("manager"),
}
"""


[[endpoint]]
uri = "/auth/posts/boss"

pre_processors = [
    { type = "simple_authentication" },
    {
        type = "authorize",
        rules = "ADMIN",
    }
]

resource = {
    type = "query",
    query = "SELECT * FROM posts",
}


[[endpoint]]
uri = "/auth/posts/manager"

pre_processors = [
    { type = "simple_authentication" },
    {
        type = "authorize",
        rules = "MANAGER",
    }
]

resource = {
    type = "query",
    query = "SELECT * FROM posts",
}


[[endpoint]]
uri = "/auth/posts/admin"

pre_processors = [
    { type = "simple_authentication" },
    {
        type = "authorize",
        rules = "#admin",
    }
]

resource = {
    type = "query",
    query = "SELECT * FROM posts",
}

