# Note that you can not to split specs for single MCP into different TOMLs

[[mcp]]
# The {project_name} path variable is automatically captured and exposed 
# to SQL/Lua resources as the {{project_name}} argument.
uri = "/mcp/rag/{project_name:[a-zA-Z0-9_-]+}"
name = "Project Knowledge Base"
instructions = """
Use this to store notes, track actions, retrieve project-specific context via full-text search,
update actions status, and delete notes or actions entries when explicitly requested.

Destructive operations require an exact id.
Use list or search tools first to find the id.ck actions, and retrieve project-specific context via full-text search.
"""


# ADD KNOWLEDGE NOTE
[mcp.tools.add_note]
title = "Add Knowledge Note"
description = "Creates a new text note in the project's knowledge base."
[mcp.tools.add_note.schema.input]
type = "dict"
items = {
    title = { type = "text", required = true, validate = { kind = "range", from = 1, to = 255 } },
    content = { type = "text", required = true }
}
[mcp.tools.add_note.resource]
type = "query"
# {{project_name}} is safely bound as a parameter from the URI path
query = """
INSERT INTO notes (project_name, title, content) 
VALUES ({{project_name}}, {{title}}, {{content}}) 
RETURNING id, title, created_at
"""

# GET KNOWLEDGE NOTE
[mcp.tools.get_note]
title = "Add Knowledge Note"
description = "Return full note content by it's ID"
[mcp.tools.get_note.schema.input]
type = "dict"
items = {
    id = { type = "int", required = true },
}
[mcp.tools.get_note.resource]
type = "query"
# {{project_name}} is safely bound as a parameter from the URI path
query = """
SELECT * FROM notes WHERE id = {{id}}
"""

# DELETE KNOWLEDGE NOTE
[mcp.tools.delete_note]
title = "Delete Knowledge Note"
description = """
Deletes a knowledge note by id for the current project.
Use list_notes or search_notes first to discover the note id.
Returns information about deleted note.
"""
annotations = { read_only = false, destructive = true, idempotent = true }

[mcp.tools.delete_note.schema.input]
type = "dict"
items = {
    id = { type = "int", required = true }
}

[mcp.tools.delete_note.resource]
type = "query"
query = """
DELETE FROM notes
WHERE id = {{id}}
  AND project_name = {{project_name}}
RETURNING id, title, created_at
"""


# LIST NOTES
[mcp.tools.list_notes]
title = "List Notes"
description = "Retrieves recent knowledge notes for the current project."
annotations = { read_only = true }
[mcp.tools.list_notes.schema.input]
type = "dict"
items = {
    limit = { type = "int" },
    offset = { type = "int" }
}
[mcp.tools.list_notes.resource]
type = "query_script_lua"
script = """
local q = query_builder("SELECT id, title, content, created_at FROM notes")
q:add("WHERE project_name = {{project_name}}")
local limit = ctx:get_arg("limit") or 42
local offset = ctx:get_arg("offset") or 0
q:add("ORDER BY created_at DESC LIMIT " .. limit .. " OFFSET " .. offset)
return q:build()
"""


# LOG ACTION UPDATE
[mcp.tools.add_action]
title = "Add Action Update"
description = """
Adds a milestone or status update for the project's actions.
Allowed statuses are: 'in_progress', 'completed', 'blocked', 'archived'.
Returns info about just created record.
"""

[mcp.tools.add_action.schema.input]
type = "dict"
items = {
    milestone = { type = "text", required = true },
    details = { type = "text", required = false },
    status = { type = "text", required = false }
}

[mcp.tools.add_action.resource]
type = "query_script_lua"
script = """
local cols = {"project_name", "milestone"}
local vals = {"{{project_name}}", "{{milestone}}"}

if ctx:has_arg("details") then 
    table.insert(cols, "details")
    table.insert(vals, "{{details}}")
end
if ctx:has_arg("status") then 
    table.insert(cols, "status")
    table.insert(vals, "{{status}}")
else
    table.insert(cols, "status")
    table.insert(vals, "'in_progress'")
end

local cols_str = table.concat(cols, ", ")
local vals_str = table.concat(vals, ", ")

return "INSERT INTO actions (" .. cols_str .. ") VALUES (" .. vals_str .. ") RETURNING id, milestone, status, updated_at"
"""


# UPDATE ACTION STATUS
[mcp.tools.update_action_status]
title = "Update Action Status"
description = """
Updates the status of an existing action entry by id.
Use list_actions first to discover the action entry id.
Allowed statuses are: 'in_progress', 'completed', 'blocked', 'archived'.
Returns information about updated record.
"""
annotations = { read_only = false, destructive = false, idempotent = true }

[mcp.tools.update_action_status.schema.input]
type = "dict"
items = {
    id = { type = "int", required = true },
    status = { type = "text", required = true }
}

[mcp.tools.update_action_status.resource]
type = "query_script_lua"
script = """
local status = tostring(ctx:get_arg("status") or "")

local allowed = {
    in_progress = true,
    completed = true,
    blocked = true,
    archived = true
}

if not allowed[status] then
    error("invalid status: expected one of in_progress, completed, blocked, archived")
end

return "UPDATE actions SET status = {{status}}, updated_at = CURRENT_TIMESTAMP WHERE id = {{id}} AND project_name = {{project_name}} RETURNING id, milestone, status, updated_at"
"""


# LIST ACTION UPDATES
[mcp.tools.list_actions]
title = "List Actions"
description = """
Retrieves recent action updates and milestones for the project.
Allowed statuses are: 'in_progress', 'completed', 'blocked', 'archived'.
"""
annotations = { read_only = true }
[mcp.tools.list_actions.schema.input]
type = "dict"
items = {
    status = { type = "text" },
    limit = { type = "int" },
    offset = { type = "int" }
}
[mcp.tools.list_actions.resource]
type = "query_script_lua"
script = """
local q = query_builder("SELECT id, milestone, details, status, updated_at FROM actions")
local where_parts = {"project_name = {{project_name}}"}
if ctx:has_arg("status") then
    table.insert(where_parts, "status = {{status}}")
end
q:add_joined_parts("WHERE", where_parts, "AND", "")
local limit = ctx:get_arg("limit") or 42
local offset = ctx:get_arg("offset") or 0
q:add("ORDER BY updated_at DESC LIMIT " .. limit .. " OFFSET " .. offset)
return q:build()
"""


# DELETE ACTION ENTRY
[mcp.tools.delete_action]
title = "Delete Action Entry"
description = """
Completely removes an action entry by id for the current project.
Use list_actions first to discover the action entry id.
"""
annotations = { read_only = false, destructive = true, idempotent = true }

[mcp.tools.delete_action.schema.input]
type = "dict"
items = {
    id = { type = "int", required = true }
}

[mcp.tools.delete_action.resource]
type = "query"
query = """
DELETE FROM actions
WHERE id = {{id}}
  AND project_name = {{project_name}}
RETURNING id, milestone, status, updated_at
"""


# SEMANTIC / FULL-TEXT SEARCH (FTS5)
[mcp.tools.search_notes]
title = "Search Knowledge Base"
description = "Performs a full-text search across all note titles and contents using SQLite FTS5 BM25 ranking."
annotations = { read_only = true, open_world = true }
[mcp.tools.search_notes.schema.input]
type = "dict"
items = {
    query = { type = "text", required = true, validate = { kind = "range", from = 1, to = 255 } },
    limit = { type = "int" },
    offset = { type = "int" }
}
[mcp.tools.search_notes.resource]
type = "query_script_lua"
script = """
local q = query_builder("SELECT n.id, n.title, snippet(notes_fts, 2, '<b>', '</b>', '...', 64) as snippet, rank FROM notes_fts JOIN notes n ON n.id = notes_fts.rowid")
local where_parts = {"notes_fts.project_name = {{project_name}}", "notes_fts MATCH {{query}}"}
q:add_joined_parts("WHERE", where_parts, "AND", "")
local limit = ctx:get_arg("limit") or 42
local offset = ctx:get_arg("offset") or 0
q:add("ORDER BY rank LIMIT " .. limit .. " OFFSET " .. offset)
return q:build()
"""

# SEARCH ACTIONS VIA FTS5
[mcp.tools.search_actions]
title = "Search Actions"
description = "Performs full-text search across action milestones and details."
annotations = { read_only = true }

[mcp.tools.search_actions.schema.input]
type = "dict"
items = {
    query  = { type = "text", required = true },
    limit  = { type = "int" },
    offset = { type = "int" }
}

[mcp.tools.search_actions.resource]
type = "query_script_lua"
script = """
local q = query_builder("SELECT a.id, a.milestone, a.details, a.status, RANK() as rank FROM actions_fts f JOIN actions a ON a.id = f.rowid")

-- Enforce tenant isolation via {{project_name}} from URI path automatically
local where_parts = {"f.project_name = {{project_name}}", "actions_fts MATCH {{query}}"}
q:add_joined_parts("WHERE", where_parts, "AND", "")

local limit = ctx:get_arg("limit") or 42
local offset = ctx:get_arg("offset") or 0
q:add("ORDER BY rank LIMIT " .. limit .. " OFFSET " .. offset)

return q:build()
"""
