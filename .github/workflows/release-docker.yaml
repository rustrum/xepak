name: Build and Publish Docker Image

on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: ["Release"] # Must exactly match the 'name' field in release.yaml
  #   types:
  #     - completed

jobs:
  build-and-publish:
    # Only run if the Release workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract release tag
        id: tag
        run: |
          # The head_branch of a release-triggered workflow_run is usually the tag (e.g. v1.0.0)
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [[ "$BRANCH" == v* ]]; then
            TAG="${BRANCH#v}"
          else
            # Fallback: fetch the latest release tag if head_branch is just 'main'
            TAG=$(gh release view --json tagName -q .tagName | sed 's/^v//')
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            TAG=${{ steps.tag.outputs.TAG }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/xepak:${{ steps.tag.outputs.TAG }}
            ghcr.io/${{ github.repository_owner }}/xepak:latest
